<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PowerForecast - Reset your password to regain access to your account.">
    <!-- PWA Metadata & Icons -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0c16">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PowerForecast">
    <link rel="apple-touch-icon" href="Assets/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="Assets/icons/favicon-32x32.png">
    <title>PowerForecast — Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('powerforecast_theme');
            if (savedTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <style>
        /* ===== CSS Reset & Base ===== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --transition-speed: 0.6s;
            --transition-ease: cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ===== DARK THEME (default) ===== */
        [data-theme="dark"] {
            --bg-top: #1a1072;
            --bg-mid: #2b2bae;
            --bg-bottom: #5b8ef5;
            --card-bg: rgba(20, 18, 80, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --input-bg: #ffffff;
            --input-text: #333333;
            --input-placeholder: #888888;
            --input-border: transparent;
            --btn-bg: #0d0d5e;
            --btn-hover-bg: #16167a;
            --divider-color: rgba(255, 255, 255, 0.25);
            --link-color: #ffd54f;
            --toggle-bg: #555555;
            --toggle-active-bg: #6c7ae0;
            --toggle-knob: #ffffff;
            --toggle-label-color: #ffffff;
            --logo-text-color: #ffffff;
            --icon-circle-bg: rgba(255, 255, 255, 0.08);
            --icon-circle-border: rgba(255, 255, 255, 0.12);
            --icon-color: #ffd54f;
        }

        /* ===== LIGHT THEME ===== */
        [data-theme="light"] {
            --bg-top: #ffffff;
            --bg-mid: #f0f0ff;
            --bg-bottom: #8a7fd6;
            --card-bg: rgba(255, 255, 255, 0.88);
            --card-border: rgba(108, 122, 224, 0.2);
            --card-shadow: 0 10px 35px rgba(26, 16, 114, 0.12);
            --text-primary: #100b46;
            --text-secondary: #3d3e75;
            --input-bg: #ffffff;
            --input-text: #1a1072;
            --input-placeholder: #7778a8;
            --input-border: rgba(108, 122, 224, 0.25);
            --btn-bg: #1a1072;
            --btn-hover-bg: #2b2bae;
            --divider-color: rgba(108, 122, 224, 0.2);
            --link-color: #4a49a2;
            --toggle-bg: #ccc;
            --toggle-active-bg: #6c7ae0;
            --toggle-knob: #ffffff;
            --toggle-label-color: #1a1072;
            --logo-text-color: #1a1072;
            --icon-circle-bg: rgba(108, 122, 224, 0.12);
            --icon-circle-border: rgba(108, 122, 224, 0.25);
            --icon-color: #5a5cc7;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            transition: background var(--transition-speed) var(--transition-ease);
        }

        /* ===== Background ===== */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            transition: opacity var(--transition-speed) var(--transition-ease);
        }

        .bg-dark {
            background: linear-gradient(180deg, #1a1072 0%, #2b2bae 40%, #5b8ef5 100%);
            opacity: 1;
        }

        .bg-light {
            background: linear-gradient(180deg, #ffffff 0%, #f5f5ff 45%, #d8d4f0 70%, #8a7fd6 100%);
            opacity: 0;
        }

        [data-theme="light"] .bg-dark { opacity: 0; }
        [data-theme="light"] .bg-light { opacity: 1; }

        /* ===== Main Layout ===== */
        .forgot-page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
        }

        /* ===== Header / Navbar ===== */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: clamp(16px, 3vh, 24px) clamp(20px, 4vw, 48px);
            position: relative;
            z-index: 10;
            width: 100%;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-area img {
            width: clamp(38px, 4vw, 50px);
            height: auto;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.2));
        }

        .logo-area span {
            font-size: clamp(1.25rem, 2vw, 1.6rem);
            font-weight: 700;
            color: var(--logo-text-color);
            letter-spacing: -0.02em;
            transition: color var(--transition-speed) var(--transition-ease);
        }

        /* ===== Theme Toggle ===== */
        .theme-toggle-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-label {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--toggle-label-color);
            transition: color var(--transition-speed) var(--transition-ease);
            user-select: none;
        }

        .toggle-switch {
            position: relative;
            width: 58px;
            height: 32px;
            cursor: pointer;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            inset: 0;
            background: var(--toggle-bg);
            border-radius: 14px;
            transition: background 0.3s ease;
        }

        .toggle-slider::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 26px;
            height: 26px;
            background: var(--toggle-knob);
            border-radius: 50%;
            transition: transform 0.3s ease;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }

        .toggle-switch input:checked + .toggle-slider {
            background: var(--toggle-active-bg);
        }

        .toggle-switch input:checked + .toggle-slider::before {
            transform: translateX(26px);
        }

        /* ===== Content Area ===== */
        .content-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: clamp(10px, 2vh, 40px) clamp(20px, 5vw, 100px);
            position: relative;
            z-index: 2;
        }

        /* ===== Bulb Image (Resilient Viewport Sizing) ===== */
        .bulb-container {
            position: fixed;
            top: max(-40px, -4vh);
            left: clamp(180px, 28vw, 450px);
            transform: translateX(-50%);
            z-index: 1;
            pointer-events: none;
            width: min(500px, 42vw);
            height: min(720px, 82vh);
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .bulb-img {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            height: 100%;
            max-height: min(680px, 78vh);
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 20px 60px rgba(0, 0, 0, 0.3));
            transition: opacity 0.5s var(--transition-ease);
        }

        .bulb-off { opacity: 1; }
        .bulb-on { opacity: 0; }

        [data-theme="light"] .bulb-off { opacity: 0; }
        [data-theme="light"] .bulb-on { opacity: 1; }

        /* Glow effect for light mode */
        .bulb-glow {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: min(480px, 38vw);
            height: min(480px, 38vw);
            max-width: 480px;
            max-height: 480px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 200, 80, 0.35) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.6s var(--transition-ease);
            pointer-events: none;
        }

        [data-theme="light"] .bulb-glow {
            opacity: 1;
        }

        /* ===== Forgot Password Card ===== */
        .forgot-card {
            width: 100%;
            max-width: 440px;
            min-width: 0;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: clamp(24px, 4vh, 46px) clamp(20px, 4vw, 42px);
            box-shadow: var(--card-shadow), 0 0 0 1px rgba(255,255,255,0.05) inset;
            transition: background var(--transition-speed) var(--transition-ease),
                        border-color var(--transition-speed) var(--transition-ease),
                        box-shadow var(--transition-speed) var(--transition-ease);
            z-index: 5;
        }

        /* Card Title */
        .card-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
            letter-spacing: -0.01em;
            transition: color var(--transition-speed) var(--transition-ease);
        }

        /* Card Subtitle */
        .card-subtitle {
            text-align: center;
            font-size: 0.92rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
            line-height: 1.5;
            transition: color var(--transition-speed) var(--transition-ease);
        }

        /* Lock Icon */
        .lock-icon-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .lock-icon-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--icon-circle-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--icon-circle-border);
            transition: background var(--transition-speed) var(--transition-ease), border-color var(--transition-speed) var(--transition-ease);
        }

        .lock-icon-circle svg {
            width: 34px;
            height: 34px;
            color: var(--icon-color);
            transition: color var(--transition-speed) var(--transition-ease);
        }

        /* Input Groups */
        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .input-group .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: #888;
            pointer-events: none;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px 14px 48px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            background: var(--input-bg);
            color: var(--input-text);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: background var(--transition-speed) var(--transition-ease),
                        border-color var(--transition-speed) var(--transition-ease),
                        color var(--transition-speed) var(--transition-ease),
                        box-shadow 0.2s ease;
        }

        .input-group input::placeholder {
            color: var(--input-placeholder);
        }

        .input-group input:focus {
            box-shadow: 0 0 0 2px rgba(108, 122, 224, 0.5);
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--btn-bg);
            color: #ffffff;
            border: none;
            border-radius: 28px;
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: var(--btn-hover-bg);
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Back to login */
        .back-text {
            text-align: center;
            margin-top: 22px;
            font-size: 0.92rem;
            color: var(--text-secondary);
        }

        .back-text a {
            color: var(--link-color);
            text-decoration: underline;
            font-weight: 600;
            transition: opacity 0.2s ease;
        }

        .back-text a:hover {
            opacity: 0.8;
        }

        /* Success State */
        .success-message {
            display: none;
            text-align: center;
        }

        .success-message.visible {
            display: block;
        }

        .success-icon-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .success-icon-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(102, 187, 106, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(102, 187, 106, 0.3);
        }

        .success-icon-circle svg {
            width: 34px;
            height: 34px;
            color: #66bb6a;
        }

        .success-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .success-subtitle {
            font-size: 0.92rem;
            color: var(--text-secondary);
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .success-subtitle strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Form state (hide on success) */
        .form-state {
            display: block;
        }

        .form-state.hidden {
            display: none;
        }

        /* ===== Responsive & Display-Ratio Media Queries ===== */
        @media (max-height: 750px) {
            .navbar {
                padding-top: 12px;
                padding-bottom: 12px;
            }
            .content-area {
                padding-bottom: 20px;
            }
            .forgot-card {
                padding-top: 24px;
                padding-bottom: 24px;
            }
            .card-subtitle {
                margin-bottom: 18px;
            }
            .input-group {
                margin-bottom: 14px;
            }
        }

        @media (max-width: 960px) {
            .content-area {
                justify-content: center;
                padding: 20px;
            }

            .bulb-container {
                left: 50%;
                width: min(340px, 70vw);
                height: min(450px, 50vh);
                opacity: 0.18;
            }

            .bulb-img {
                max-height: 420px;
            }

            .forgot-card {
                width: 100%;
                max-width: 420px;
            }
        }

        @media (max-width: 480px) {
            .navbar {
                padding: 14px 16px;
            }

            .forgot-card {
                padding: 24px 18px;
                border-radius: 16px;
            }

            .logo-area span {
                font-size: 1.2rem;
            }
        }

        /* ===== Entrance Animation ===== */
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .forgot-card {
            animation: fadeSlideUp 0.7s ease-out both;
            animation-delay: 0.15s;
        }

        .bulb-container {
            animation: fadeIn 0.8s ease-out both;
            animation-delay: 0.05s;
        }

        .navbar {
            animation: fadeIn 0.6s ease-out both;
        }
    </style>
</head>
<body>
    <!-- Background layers -->
    <div class="bg-layer bg-dark"></div>
    <div class="bg-layer bg-light"></div>

    <div class="forgot-page">
        <!-- Navbar -->
        <nav class="navbar" id="navbar">
            <div class="logo-area">
                <img src="Assets/LOGO.png" alt="PowerForecast Logo" id="logo-img">
                <span>powerforecast</span>
            </div>
            <div class="theme-toggle-area">
                <span class="theme-label" id="theme-label">Dark</span>
                <label class="toggle-switch" id="theme-toggle">
                    <input type="checkbox" id="theme-checkbox" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </nav>

        <!-- Bulb (Fixed wallpaper layer) -->
        <div class="bulb-container">
            <div class="bulb-glow"></div>
            <img src="Assets/Off.png" alt="Bulb Off" class="bulb-img bulb-off" id="bulb-off">
            <img src="Assets/On.png" alt="Bulb On" class="bulb-img bulb-on" id="bulb-on">
        </div>

        <!-- Content -->
        <div class="content-area">
            <div class="forgot-card" id="forgot-card">

                <!-- Form State -->
                <div class="form-state" id="form-state">
                    <!-- Lock Icon -->
                    <div class="lock-icon-wrapper">
                        <div class="lock-icon-circle">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                        </div>
                    </div>

                    <h1 class="card-title">Forgot Password?</h1>
                    <p class="card-subtitle">No worries! Enter your email address below and we'll send you a link to reset your password.</p>

                    <!-- Email -->
                    <div class="input-group">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="2"/>
                            <path d="M22 4L12 13L2 4"/>
                        </svg>
                        <input type="email" id="email-input" placeholder="Enter your email" autocomplete="email">
                    </div>

                    <!-- Submit Button -->
                    <button class="submit-btn" id="submit-btn" type="button">Send Reset Link</button>

                    <!-- Back to login -->
                    <p class="back-text"><a href="login.html" id="back-login-link">← Back to Login</a></p>
                </div>

                <!-- Success State -->
                <div class="success-message" id="success-state">
                    <div class="success-icon-wrapper">
                        <div class="success-icon-circle">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"/>
                            </svg>
                        </div>
                    </div>

                    <p class="success-title">Check your inbox!</p>
                    <p class="success-subtitle">We've sent a password reset link to<br><strong id="sent-email"></strong></p>

                    <button class="submit-btn" id="resend-btn" type="button" style="background: transparent; border: 2px solid rgba(255,255,255,0.2); box-shadow: none;">Resend Email</button>

                    <p class="back-text" style="margin-top: 18px;"><a href="login.html">← Back to Login</a></p>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Theme Toggle
        const themeCheckbox = document.getElementById('theme-checkbox');
        const themeLabel = document.getElementById('theme-label');
        const html = document.documentElement;

        function setTheme(isDark) {
            if (isDark) {
                html.setAttribute('data-theme', 'dark');
                themeLabel.textContent = 'Dark';
                themeCheckbox.checked = true;
                localStorage.setItem('powerforecast_theme', 'dark');
            } else {
                html.setAttribute('data-theme', 'light');
                themeLabel.textContent = 'Light';
                themeCheckbox.checked = false;
                localStorage.setItem('powerforecast_theme', 'light');
            }
        }

        themeCheckbox.addEventListener('change', () => {
            setTheme(themeCheckbox.checked);
        });

        // Initialize from localStorage or default to dark
        const savedTheme = localStorage.getItem('powerforecast_theme');
        setTheme(savedTheme ? savedTheme === 'dark' : true);

        // Submit handler
        document.getElementById('submit-btn').addEventListener('click', () => {
            const email = document.getElementById('email-input').value.trim();
            const card = document.getElementById('forgot-card');

            if (!email) {
                card.style.animation = 'none';
                card.offsetHeight;
                card.style.animation = 'shake 0.4s ease';
                showError('Please enter your email address.');
                return;
            }

            // Basic email validation
            if (!email.includes('@') || !email.includes('.')) {
                card.style.animation = 'none';
                card.offsetHeight;
                card.style.animation = 'shake 0.4s ease';
                showError('Please enter a valid email address.');
                return;
            }

            // Clear any error
            const errEl = document.getElementById('forgot-error');
            if (errEl) errEl.remove();

            // Show success state
            document.getElementById('form-state').classList.add('hidden');
            document.getElementById('success-state').classList.add('visible');
            document.getElementById('sent-email').textContent = email;
        });

        // Resend button
        document.getElementById('resend-btn').addEventListener('click', () => {
            const btn = document.getElementById('resend-btn');
            btn.textContent = 'Email Resent ✓';
            btn.style.borderColor = 'rgba(102, 187, 106, 0.5)';
            btn.style.color = '#66bb6a';
            setTimeout(() => {
                btn.textContent = 'Resend Email';
                btn.style.borderColor = 'rgba(255,255,255,0.2)';
                btn.style.color = '#ffffff';
            }, 3000);
        });

        function showError(msg) {
            let errMsg = document.getElementById('forgot-error');
            if (!errMsg) {
                errMsg = document.createElement('p');
                errMsg.id = 'forgot-error';
                errMsg.style.cssText = 'color:#ff6b6b;font-size:0.85rem;text-align:center;margin-top:10px;font-weight:500;';
                document.getElementById('submit-btn').insertAdjacentElement('afterend', errMsg);
            }
            errMsg.textContent = msg;
        }

        // Enter key to submit
        document.getElementById('email-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('submit-btn').click();
        });

        // Shake keyframes
        const styleSheet = document.createElement('style');
        styleSheet.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                15% { transform: translateX(-8px); }
                30% { transform: translateX(8px); }
                45% { transform: translateX(-6px); }
                60% { transform: translateX(6px); }
                75% { transform: translateX(-3px); }
                90% { transform: translateX(3px); }
            }
        `;
        document.head.appendChild(styleSheet);
    </script>
    <!-- PWA Support Script -->
    <script src="pwa-install.js"></script>
</body>
</html>
